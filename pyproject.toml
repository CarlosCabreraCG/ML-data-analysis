[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensor_analytics"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "joblib>=1.3",
  "lightgbm>=4.0",
  "statsmodels>=0.14",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev   = ["pytest>=7"]

[project.scripts]
sensor-analytics = "src.cli:main"